name: CI/CD - casino-backend

on:
  push:
    branches: [deploy]

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias backend
        run: npm test

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen Docker
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO=$(echo "${{ secrets.ECR_REPOSITORY }}" | tr -d '[:space:]')
          TAG="${{ github.sha }}"
          docker build -t "$REGISTRY/$REPO:$TAG" .

      - name: Tag imagen latest
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO=$(echo "${{ secrets.ECR_REPOSITORY }}" | tr -d '[:space:]')
          TAG="${{ github.sha }}"
          docker tag "$REGISTRY/$REPO:$TAG" "$REGISTRY/$REPO:latest"

      - name: Push imagen SHA
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO=$(echo "${{ secrets.ECR_REPOSITORY }}" | tr -d '[:space:]')
          TAG="${{ github.sha }}"
          docker push "$REGISTRY/$REPO:$TAG"

      - name: Push imagen latest
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO=$(echo "${{ secrets.ECR_REPOSITORY }}" | tr -d '[:space:]')
          docker push "$REGISTRY/$REPO:latest"

      - name: Actualizar kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER }}

      - name: Deploy en EKS
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO=$(echo "${{ secrets.ECR_REPOSITORY }}" | tr -d '[:space:]')
          TAG="${{ github.sha }}"
          kubectl set image deployment/casino-backend casino-backend="$REGISTRY/$REPO:$TAG"
          kubectl rollout status deployment/casino-backend
